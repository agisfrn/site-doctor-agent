[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "site-doctor"
dynamic = ["version"]
description = "An AI agent that explores a website, finds what's broken and writes a scored report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "playwright>=1.50",
    "typer>=0.12",
    "rich>=13",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
site-doctor = "site_doctor.cli:main"

[tool.hatch.version]
path = "src/site_doctor/__init__.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
